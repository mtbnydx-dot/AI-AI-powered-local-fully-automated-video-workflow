[project]
name = "drama-factory"
version = "0.1.0"
description = "Offline control plane for multi-node 8xB200 AI short-drama production (MiniMax H3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "PyYAML>=6,<7",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
s3 = ["boto3>=1.34,<2"]
dev = ["pytest>=8"]

[project.scripts]
dfctl = "drama_factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drama_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
