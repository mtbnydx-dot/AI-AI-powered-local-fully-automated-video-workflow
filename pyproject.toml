[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videopipe"
version = "0.1.0"
description = "Offline CLI video production with ComfyUI and vLLM"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3", "PyYAML>=6,<7", "Pillow>=10,<13", "imageio-ffmpeg>=0.5,<1"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]

[project.scripts]
videopipe = "videopipe.cli:main"

[tool.setuptools.packages.find]
include = ["videopipe*"]

[tool.setuptools.package-data]
videopipe = ["workflows/*.json", "workflows/*.md"]
