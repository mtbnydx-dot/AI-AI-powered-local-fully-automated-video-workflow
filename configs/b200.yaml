generator: comfyui
comfyui:
  urls:
    - http://127.0.0.1:8188
    - http://127.0.0.1:8189
    - http://127.0.0.1:8190
    - http://127.0.0.1:8191
    - http://127.0.0.1:8192
    - http://127.0.0.1:8193
    - http://127.0.0.1:8194
  timeout: 3600
  maximum_duration_seconds: 10
  parameters:
    steps: 10
# GPU0-6: generation and per-shot upscale; GPU7: Qwen review + ASR.
# Qwen weights: nvidia/Qwen3.8-Flash-Next-NVFP4; start with deploy/start-vllm.sh.
# Its CPU embedding offload, 0.80 VRAM, TP1 and 64K context need a real B200 smoke test.
review:
  backend: vllm
  url: http://127.0.0.1:8000/v1
  model: qwen-review
  workers: 6  # Keep aligned with REVIEW_MAX_SEQS.
  sample_frames: 48
  max_frame_size: 1024
# Local faster-whisper model directory, or a fully pre-cached large-v3 model.
# ASR runs once after concatenation on GPU7; unavailable ASR never blocks delivery.
asr:
  enabled: true
  model: large-v3
  gpu: 7
  compute_type: int8_float16
  language: null
  timeout: 600
media:
  width: 576
  height: 1024
  fps: 24
  upscale: comfyui
  upscale_factor: 2
script:
  language: Chinese
  non_diegetic_music: N/A
  on_screen_text: Include story-relevant writing. But do not generate subtitles.
workers: 7
max_attempts: 3
human_approval: false
