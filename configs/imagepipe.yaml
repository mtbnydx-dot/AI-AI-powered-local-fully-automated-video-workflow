provider: gpt
api:
  base_url: https://api.openai.com
  env_file: .env
  key_name: OPENAI
  request_timeout_seconds: 900
  max_reference_images: 16
generation:
  model: gpt-image-2.6-sunburst
  quality: max
  complexity: high
  native_width: 1152
  native_height: 2048
scheduler:
  http_concurrency: 140
  max_active_jobs: 140
  images_per_minute: 105
  tokens_per_minute: 2100000
  estimated_tokens_per_image: 20000
  poll_interval_seconds: 5
continuity:
  auto_scene_anchors: true
  reference_priority: {}  # Per first-frame asset: reference asset IDs in priority order.
